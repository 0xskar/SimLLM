[project]
name = "simllm"
version = "0.1.0"
description = "LLM agents living in a small simulated city"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ollama>=0.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simllm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
